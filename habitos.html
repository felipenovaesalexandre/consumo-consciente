<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hábitos Sustentáveis</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Menu -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                Consumo Consciente
            </a>

            <button 
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="consumo.html">
                            Consumo
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="habitos.html">
                            Hábitos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="dicas.html">
                            Dicas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="reciclagem.html">
                            Reciclagem
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>


    <!-- Conteúdo -->
    <main class="container py-5">

        <div class="text-center mb-5">

            <h1>Meus hábitos sustentáveis</h1>

            <p class="lead">
                Responda algumas perguntas para conhecer melhor
                seus hábitos de consumo.
            </p>

        </div>


        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h4 class="mb-4">
                            💡 Energia
                        </h4>

                        <label class="form-label">
                            Você apaga as luzes quando sai de um ambiente?
                        </label>

                        <select class="form-select mb-4" id="luzes">
                            <option value="">Selecione</option>
                            <option value="sim">Sempre</option>
                            <option value="as-vezes">Às vezes</option>
                            <option value="nao">Nunca</option>
                        </select>


                        <h4 class="mb-4">
                            💧 Água
                        </h4>

                        <label class="form-label">
                            Você evita deixar a torneira aberta sem necessidade?
                        </label>

                        <select class="form-select mb-4" id="torneira">
                            <option value="">Selecione</option>
                            <option value="sim">Sempre</option>
                            <option value="as-vezes">Às vezes</option>
                            <option value="nao">Nunca</option>
                        </select>


                        <h4 class="mb-4">
                            🚗 Transporte
                        </h4>

                        <label class="form-label">
                            Você utiliza alternativas ao carro quando possível?
                        </label>

                        <select class="form-select mb-4" id="transporteHabito">
                            <option value="">Selecione</option>
                            <option value="sim">Sempre</option>
                            <option value="as-vezes">Às vezes</option>
                            <option value="nao">Nunca</option>
                        </select>


                        <h4 class="mb-4">
                            ♻️ Reciclagem
                        </h4>

                        <label class="form-label">
                            Você separa materiais recicláveis?
                        </label>

                        <select class="form-select mb-4" id="reciclagemHabito">
                            <option value="">Selecione</option>
                            <option value="sim">Sempre</option>
                            <option value="as-vezes">Às vezes</option>
                            <option value="nao">Nunca</option>
                        </select>


                        <button
                            type="button"
                            class="btn btn-success w-100"
                            onclick="avaliarHabitos()"
                        >
                            Avaliar meus hábitos
                        </button>


                        <div
                            id="resultadoHabitos"
                            class="alert alert-success mt-4 d-none"
                        >
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/script.js"></script>

</body>
</html>
