<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consumo</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- CSS próprio -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Menu -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            Consumo Consciente
        </a>

        <button 
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Início
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="consumo.html">
                        Consumo
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="habitos.html">
                        Hábitos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="dicas.html">
                        Dicas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="reciclagem.html">
                        Reciclagem
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>


    <!-- Conteúdo -->
    <main class="container py-5">

        <div class="text-center mb-5">

            <h1>Meu Consumo</h1>

            <p class="lead">
                Informe seus gastos para acompanhar seu consumo
                e identificar oportunidades de economia.
            </p>

        </div>


        <!-- Formulário -->
        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h3 class="mb-4">
                            Registrar consumo
                        </h3>


                        <!-- Energia -->
                        <div class="mb-4">

                            <label for="energia" class="form-label">
                                💡 Gasto mensal com energia elétrica
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    R$
                                </span>

                                <input 
                                    type="number"
                                    class="form-control"
                                    id="energia"
                                    placeholder="Ex.: 150"
                                    min="0"
                                >

                            </div>

                        </div>


                        <!-- Água -->
                        <div class="mb-4">

                            <label for="agua" class="form-label">
                                💧 Gasto mensal com água
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    R$
                                </span>

                                <input 
                                    type="number"
                                    class="form-control"
                                    id="agua"
                                    placeholder="Ex.: 80"
                                    min="0"
                                >

                            </div>

                        </div>


                        <!-- Transporte -->
                        <div class="mb-4">

                            <label for="transporte" class="form-label">
                                🚗 Gasto mensal com transporte
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    R$
                                </span>

                                <input 
                                    type="number"
                                    class="form-control"
                                    id="transporte"
                                    placeholder="Ex.: 300"
                                    min="0"
                                >

                            </div>

                        </div>


                        <button 
                            type="button" 
                            class="btn btn-success w-100"
                            onclick="calcularConsumo()"
                        >
                            Calcular
                        </button>


                        <!-- Resultado -->
                        <div 
                            id="resultado" 
                            class="alert alert-success mt-4 d-none"
                        >
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap JavaScript -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Chart gráfico-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- JavaScript próprio -->
    <script src="js/script.js"></script>

</body>
</html>
